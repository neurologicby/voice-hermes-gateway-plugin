name: Plugin quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
      - name: Checkout Hermes Agent contract target
        uses: actions/checkout@v4
        with:
          repository: nousresearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Hermes contract target and plugin dependencies
        run: |
          python -m pip install -e .\hermes-agent
          python -m pip install ".[dev]"
      - name: Unit and contract tests
        env:
          HERMES_SOURCE: ${{ github.workspace }}\hermes-agent
        run: python -m pytest -q
      - name: Static checks
        run: |
          ruff check .
          mypy hermes_voice_gateway
